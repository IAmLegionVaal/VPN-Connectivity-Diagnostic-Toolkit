name: PowerShell static QA and Pester
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell without executing scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in Get-ChildItem -Path . -Recurse -Filter '*.ps1') {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { throw "Syntax errors in $($file.FullName): $($errors -join '; ')" }
          }
      - name: Run read-only Pester static tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '5.7.1'
          if (-not (Get-Module -ListAvailable Pester | Where-Object Version -eq $version)) {
            Install-Module -Name Pester -RequiredVersion $version -Scope CurrentUser -Repository PSGallery -Force -ErrorAction Stop
          }
          Import-Module Pester -RequiredVersion $version -ErrorAction Stop
          Invoke-Pester -Path './tests' -CI -Output Detailed
